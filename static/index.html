<!DOCTYPE html>
<html>
    <head>
        <title>Ring Report</title>
        <style>
            h1 {
                color: whitesmoke
            }
            body {
                background-color: #1D2545;
                color: white;
                font-family: 'Montserrat', sans-serif;
                padding: 40px;
            }
            .card {
                background-color: #414375;
                border-radius: 12px;
                padding: 28px;
                margin: 10px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 20px;
                margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <h1>ring report</h1>
        <p>athlete dashboard</p>
        <div class="grid">
            <div class="card">
                <p>readiness score</p>
                <h2 id="readiness-score">--</h2>
            </div>
            <div class="card">
                <p>sleep score</p>
                <h2 id="sleep-score">--</h2>
            </div>
            <div class="card" style="padding-top: 14px; padding-bottom: 14px">
                <div>
                    <p>weather</p>
                    <h2 id="weather-temp">--</h2>
                    <h2 id="weather-temp-low">--</h2>
                    <h2 id="weather-temp-high">--</h2>
                    <h2 id="weather-temp-feels-like">--</h2>
                    <h2 id="weather-temp-desc">--</h2>
                </div>
            </div>
        </div>
        <div id="flags">
            <h2>flags & recommendations</h2>
            <div id="flags-container"></div>
        </div>
        <div id="insights">
            <h2>ai insights</h2>
            <p id="insights-text">loading...</p>
        </div>
        <div id="log">
            <h2>workout log</h2>
            <p id="workout-logs"></p>
        </div>

        <form>
            <label for="date">date:</label>
            <input type="date" id="date" name="date">

            <label for="duration">workout duration (min):</label>
            <input type="number" id="duration" name="duration">

            <label for="type">workout type:</label>
            <select name="type" id="type">
                <option value="match">match</option>
                <option value="practice">practice</option>
                <option value="lift">lift</option>
                <option value="conditioning">conditioning</option>
                <option value="rest">rest</option>
            </select>

            <label for="intensity">intensity (1-10): <span id="intensity-value">5</span></label>
            <input type="range" id="intensity" min="1" max="10" value="5"
                oninput="document.getElementById('intensity-value').textContent=this.value">

            <label for="soreness">soreness (1-5): <span id="soreness-value">1</span></label>
            <input type="range" id="soreness" min="1" max="5" value="1"
                oninput="document.getElementById('soreness-value').textContent=this.value">

            <label for="joint_pain">joint pain (1-5): <span id="joint-value">1</span></label>
            <input type="range" id="joint_pain" min="1" max="5" value="1"
                oninput="document.getElementById('joint-value').textContent=this.value">

            <label for="fatigue">fatigue (1-5): <span id="fatigue-value">1</span></label>
            <input type="range" id="fatigue" min="1" max="5" value="1"
                oninput="document.getElementById('fatigue-value').textContent=this.value">

            <label for="notes">notes:</label>
            <textarea id="notes" name="notes" placeholder="how are you feeling? anything worth noting..."></textarea>
            <button type="button" id="submit-button">submit</button>
        </form>

        <div id="logs-section">
            <h2>workout log history</h2>
            <div id="logs-container"></div>
        </div>

        <script>
            Promise.all([
                fetch('/api/readiness').then(response => response.json()),
                fetch('/api/sleep').then(response => response.json()),
                fetch('/api/weather').then(response => response.json()),
                ]).then(([readinessData, sleepData, weatherData]) => {
                    const readiness = readinessData.data[readinessData.data.length - 1];
                    const sleep = sleepData.data[sleepData.data.length - 1];

                    document.getElementById('readiness-score').textContent = readiness.score;
                    document.getElementById('sleep-score').textContent = sleep.score;
                    document.getElementById('weather-temp').textContent = 'temp: ' + weatherData.main.temp + 'ºF';
                    document.getElementById('weather-temp-low').textContent = 'low: ' + weatherData.main.temp_min + 'ºF';
                    document.getElementById('weather-temp-high').textContent = 'high: ' + weatherData.main.temp_max + 'ºF';
                    document.getElementById('weather-temp-feels-like').textContent = 'feels like: ' + weatherData.main.feels_like + 'ºF';
                    document.getElementById('weather-temp-desc').textContent = weatherData.weather[0].description;
                });

                fetch('/api/insights')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('insights-text').textContent = data.insight;
                });

                function loadLogs() {
                    fetch('/api/logs')
                    .then(r => r.json())
                    .then(logs => {
                        const container = document.getElementById('logs-container');
                        container.innerHTML = '';
                        if (logs.length === 0) {
                            container.innerHTML = '<p>no logs yet</p>';
                            return;
                        }
                        logs.forEach(log => {
                            const div = document.createElement('div');
                            div.className = 'card';
                            div.style.marginBottom = '10px';
                            div.innerHTML = `<strong>${log.date}</strong> — ${log.workout_type}, ${log.duration} min${log.intensity ? ', intensity ' + log.intensity + '/10' : ''}${log.soreness ? ', soreness ' + log.soreness + '/5' : ''}${log.joint_pain ? ', joint pain ' + log.joint_pain + '/5' : ''}${log.fatigue ? ', fatigue ' + log.fatigue + '/5' : ''}${log.notes ? '<br>notes: ' + log.notes : ''}`;
                            container.appendChild(div);
                        });
                    });
                }

                loadLogs();

                document.getElementById('submit-button').addEventListener('click', function() {
                    fetch('/api/log', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            date: document.getElementById('date').value,
                            duration: document.getElementById('duration').value,
                            workout_type: document.getElementById('type').value,
                            intensity: document.getElementById('intensity').value,
                            soreness: document.getElementById('soreness').value,
                            joint_pain: document.getElementById('joint_pain').value,
                            fatigue: document.getElementById('fatigue').value,
                            notes: document.getElementById('notes').value
                        })
                    }).then(() => loadLogs())
                });
        </script>
    </body>
</html>
